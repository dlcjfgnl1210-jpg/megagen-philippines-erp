<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAGEN KPI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HEADER -->
<header class="bg-white border-b shadow-sm sticky top-0 z-10">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-purple-600 rounded-xl flex items-center justify-center text-white text-lg">📊</div>
      <div>
        <h1 class="font-bold text-gray-900">KPI Dashboard</h1>
        <p class="text-xs text-gray-400">세일즈랩 실적 · MEGAGEN Philippines</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <select id="month-select" onchange="updateAll()" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-purple-500">
        <option value="5">May 2026</option>
        <option value="4">Apr 2026</option>
        <option value="3">Mar 2026</option>
        <option value="2">Feb 2026</option>
        <option value="1">Jan 2026</option>
      </select>
      <button onclick="location.href='megagen-erp-home.html'" class="text-xs text-gray-500 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50">← Home</button>
    </div>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 py-6">

  <!-- Summary Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    <div class="bg-white rounded-xl p-4 border shadow-sm">
      <p class="text-xs text-gray-500">Monthly Target</p>
      <p id="kpi-target" class="text-2xl font-bold text-gray-900 mt-1">₱0</p>
      <p class="text-xs text-gray-400 mt-1">목표</p>
    </div>
    <div class="bg-white rounded-xl p-4 border shadow-sm">
      <p class="text-xs text-gray-500">Actual Sales</p>
      <p id="kpi-actual" class="text-2xl font-bold text-blue-600 mt-1">₱0</p>
      <p class="text-xs text-gray-400 mt-1">실적</p>
    </div>
    <div class="bg-white rounded-xl p-4 border shadow-sm">
      <p class="text-xs text-gray-500">Achievement</p>
      <p id="kpi-rate" class="text-2xl font-bold text-green-600 mt-1">0%</p>
      <p class="text-xs text-gray-400 mt-1">달성률</p>
    </div>
    <div class="bg-white rounded-xl p-4 border shadow-sm">
      <p class="text-xs text-gray-500">Total Orders</p>
      <p id="kpi-orders" class="text-2xl font-bold text-purple-600 mt-1">0</p>
      <p class="text-xs text-gray-400 mt-1">주문 건수</p>
    </div>
  </div>

  <!-- Achievement Progress -->
  <div class="bg-white rounded-2xl p-5 border shadow-sm mb-6">
    <div class="flex justify-between items-center mb-3">
      <span class="text-sm font-semibold text-gray-700">Achievement Rate 달성률</span>
      <span id="progress-label" class="text-sm font-bold text-blue-600">0%</span>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-4">
      <div id="progress-bar" class="h-4 rounded-full bg-blue-600 transition-all duration-500" style="width:0%"></div>
    </div>
    <div class="flex justify-between text-xs text-gray-400 mt-1">
      <span>₱0</span>
      <span id="progress-target">₱500,000</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-6 mb-4 border-b">
    <button onclick="switchTab('trend')" id="tab-trend" class="tab-active pb-3 text-sm">매출 추이 Trend</button>
    <button onclick="switchTab('category')" id="tab-category" class="tab-inactive pb-3 text-sm">카테고리 Category</button>
    <button onclick="switchTab('customers')" id="tab-customers" class="tab-inactive pb-3 text-sm">Top 고객 Customers</button>
    <button onclick="switchTab('orders')" id="tab-orders" class="tab-inactive pb-3 text-sm">주문 내역 Orders</button>
  </div>

  <!-- Tab Content -->
  <div id="panel-trend" class="bg-white rounded-2xl p-5 border shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">Monthly Sales Trend (₱)</h3>
    <canvas id="trend-chart" height="120"></canvas>
  </div>

  <div id="panel-category" class="hidden bg-white rounded-2xl p-5 border shadow-sm">
    <h3 class="text-sm font-semibold text-gray-700 mb-4">Sales by Category</h3>
    <div class="flex flex-col md:flex-row gap-4 items-center">
      <div class="w-full md:w-64"><canvas id="category-chart"></canvas></div>
      <div id="category-legend" class="flex-1 space-y-2"></div>
    </div>
  </div>

  <div id="panel-customers" class="hidden">
    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b">
          <tr>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">#</th>
            <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500">Customer</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500">Orders</th>
            <th class="text-right px-4 py-3 text-xs font-semibold text-gray-500">Total Sales</th>
          </tr>
        </thead>
        <tbody id="customer-table"></tbody>
      </table>
    </div>
  </div>

  <div id="panel-orders" class="hidden">
    <div id="orders-list" class="space-y-2"></div>
  </div>

</div>

<script>
const MONTHLY_DATA = {
  1: { target: 500000, actual: 450000, orders: 18 },
  2: { target: 500000, actual: 480000, orders: 21 },
  3: { target: 550000, actual: 540000, orders: 24 },
  4: { target: 550000, actual: 490000, orders: 19 },
  5: { target: 500000, actual: 425000, orders: 16 },
};

const CAT_DATA = [
  { name: 'Fixture', value: 180000, color: '#2563eb' },
  { name: 'Healing Abutment', value: 95000, color: '#10b981' },
  { name: 'Abutment', value: 72000, color: '#8b5cf6' },
  { name: 'Cover Screw', value: 42000, color: '#f59e0b' },
  { name: 'Bone Graft', value: 28000, color: '#ef4444' },
  { name: 'Membrane', value: 22000, color: '#06b6d4' },
  { name: 'Impression Coping', value: 18000, color: '#84cc16' },
  { name: 'Accessory', value: 12000, color: '#6b7280' },
];

const CUSTOMERS_DATA = [
  { name: 'Bright Smile Dental', doctor: 'Dr. Dela Cruz', orders: 5, total: 98000 },
  { name: 'Sunrise Dental Clinic', doctor: 'Dr. Santos', orders: 4, total: 76000 },
  { name: 'Pacific Dental Center', doctor: 'Dr. Garcia', orders: 3, total: 64000 },
  { name: 'MedDental Clinic', doctor: 'Dr. Reyes', orders: 2, total: 45000 },
  { name: 'City Dental Group', doctor: 'Dr. Lim', orders: 2, total: 38000 },
  { name: 'Family Smile Clinic', doctor: 'Dr. Tan', orders: 1, total: 30000 },
  { name: 'Smile Zone', doctor: 'Dr. Cruz', orders: 1, total: 28000 },
  { name: 'Happy Teeth', doctor: 'Dr. Flores', orders: 1, total: 21000 },
  { name: 'Metro Dental', doctor: 'Dr. Ramos', orders: 1, total: 18000 },
  { name: 'UniDent', doctor: 'Dr. Bautista', orders: 1, total: 12000 },
];

let currentTab = 'trend';
let trendChart = null;
let categoryChart = null;

function updateAll() {
  const m = parseInt(document.getElementById('month-select').value);
  const d = MONTHLY_DATA[m] || MONTHLY_DATA[5];
  const pct = Math.round((d.actual / d.target) * 100);
  const barPct = Math.min(pct, 100);
  const barColor = pct >= 100 ? '#10b981' : pct >= 80 ? '#2563eb' : pct >= 60 ? '#f59e0b' : '#ef4444';

  document.getElementById('kpi-target').textContent  = '₱' + d.target.toLocaleString();
  document.getElementById('kpi-actual').textContent  = '₱' + d.actual.toLocaleString();
  document.getElementById('kpi-rate').textContent    = pct + '%';
  document.getElementById('kpi-orders').textContent  = d.orders;
  document.getElementById('progress-label').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = barPct + '%';
  document.getElementById('progress-bar').style.backgroundColor = barColor;
  document.getElementById('progress-target').textContent = '₱' + d.target.toLocaleString();
  document.getElementById('kpi-rate').style.color = barColor;
}

function switchTab(tab) {
  ['trend','category','customers','orders'].forEach(t => {
    document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);
    document.getElementById('tab-' + t).className = (t === tab ? 'tab-active' : 'tab-inactive') + ' pb-3 text-sm';
  });
  currentTab = tab;
  if (tab === 'trend' && !trendChart) initTrendChart();
  if (tab === 'category' && !categoryChart) initCategoryChart();
  if (tab === 'customers') renderCustomerTable();
  if (tab === 'orders') renderOrdersList();
}

function initTrendChart() {
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May'];
  const actuals = [450000, 480000, 540000, 490000, 425000];
  const targets = [500000, 500000, 550000, 550000, 500000];
  const ctx = document.getElementById('trend-chart').getContext('2d');
  trendChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [
        { label: 'Actual 실적', data: actuals, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.08)', tension: 0.4, fill: true, pointBackgroundColor: '#2563eb' },
        { label: 'Target 목표', data: targets, borderColor: '#ef4444', borderDash: [6,4], tension: 0, fill: false, pointRadius: 3, pointBackgroundColor: '#ef4444' },
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16, font: { size: 11 } } } },
      scales: {
        y: {
          beginAtZero: false,
          ticks: { callback: v => '₱' + (v/1000) + 'K', font: { size: 11 } },
          grid: { color: '#f3f4f6' }
        },
        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
      }
    }
  });
}

function initCategoryChart() {
  const ctx = document.getElementById('category-chart').getContext('2d');
  categoryChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: CAT_DATA.map(c => c.name),
      datasets: [{ data: CAT_DATA.map(c => c.value), backgroundColor: CAT_DATA.map(c => c.color), borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      cutout: '60%'
    }
  });

  const total = CAT_DATA.reduce((s, c) => s + c.value, 0);
  document.getElementById('category-legend').innerHTML = CAT_DATA.map(c => {
    const pct = ((c.value / total) * 100).toFixed(1);
    return `
      <div class="flex items-center justify-between py-1.5 border-b border-gray-50">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${c.color}"></span>
          <span class="text-sm text-gray-700">${c.name}</span>
        </div>
        <div class="text-right ml-4">
          <span class="text-sm font-semibold text-gray-900">₱${c.value.toLocaleString()}</span>
          <span class="text-xs text-gray-400 ml-1">${pct}%</span>
        </div>
      </div>`;
  }).join('');
}

function renderCustomerTable() {
  const sorted = [...CUSTOMERS_DATA].sort((a,b) => b.total - a.total);
  document.getElementById('customer-table').innerHTML = sorted.map((c, i) => `
    <tr class="border-b border-gray-50 hover:bg-gray-50">
      <td class="px-4 py-3 text-gray-400 font-medium">${i + 1}</td>
      <td class="px-4 py-3">
        <p class="font-medium text-gray-900">${c.name}</p>
        <p class="text-xs text-gray-400">${c.doctor}</p>
      </td>
      <td class="px-4 py-3 text-right text-gray-600">${c.orders}</td>
      <td class="px-4 py-3 text-right font-bold text-blue-600">₱${c.total.toLocaleString()}</td>
    </tr>`).join('');
}

function renderOrdersList() {
  const orders = JSON.parse(localStorage.getItem('mg-orders') || '[]');
  const el = document.getElementById('orders-list');
  if (orders.length === 0) {
    el.innerHTML = '<p class="text-center text-gray-400 py-8 text-sm">No orders yet. Place orders in the Order System.</p>';
    return;
  }
  const statusStyle = { '접수중':'bg-blue-100 text-blue-700', '처리중':'bg-yellow-100 text-yellow-700', '출고완료':'bg-green-100 text-green-700', '접수반려':'bg-red-100 text-red-700' };
  el.innerHTML = orders.map(o => `
    <div class="bg-white border border-gray-200 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-sm font-semibold text-gray-900">${o.customerName}</p>
          <p class="text-xs text-gray-400">${o.id} · ${new Date(o.date).toLocaleDateString()}</p>
        </div>
        <div class="text-right">
          <span class="text-xs px-2 py-1 rounded-full font-medium ${statusStyle[o.status] || 'bg-gray-100 text-gray-600'}">${o.status}</span>
          <p class="text-sm font-bold text-blue-600 mt-1">₱${o.total.toLocaleString()}</p>
        </div>
      </div>
    </div>`).join('');
}

// Init
updateAll();
initTrendChart();
</script>
</body>
</html>
